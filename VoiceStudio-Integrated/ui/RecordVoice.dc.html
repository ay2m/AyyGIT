<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { color: #1d4ed8; }
  </style>
</helmet>

<!-- Record Voice Screen -->
<div style="width: 1440px; min-height: 900px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; display: flex; flex-direction: column;">
  <!-- Header -->
  <div style="padding: 24px 32px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">🎤</div>
      <h1 style="font-size: 24px; font-weight: 600;">VoiceStudio</h1>
    </div>
    <div style="display: flex; gap: 16px;">
      <button style="padding: 10px 16px; background: rgba(255,255,255,0.2); border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 14px;">← Back</button>
    </div>
  </div>

  <!-- Main Content -->
  <div style="flex: 1; padding: 48px 32px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <!-- Waveform Visualization -->
    <div style="background: rgba(255,255,255,0.1); border-radius: 16px; padding: 48px; margin-bottom: 32px; width: 100%; max-width: 800px; text-align: center; backdrop-filter: blur(10px);">
      <div style="font-size: 12px; color: rgba(255,255,255,0.7); margin-bottom: 24px;">Recording Status</div>

      <!-- Waveform bars -->
      <div style="display: flex; align-items: flex-end; justify-content: center; gap: 6px; height: 120px; margin-bottom: 32px;">
        <div style="width: 8px; height: 40px; background: #667eea; border-radius: 4px; animation: pulse 0.5s infinite;"></div>
        <div style="width: 8px; height: 60px; background: #667eea; border-radius: 4px; animation: pulse 0.6s infinite;"></div>
        <div style="width: 8px; height: 80px; background: #667eea; border-radius: 4px; animation: pulse 0.7s infinite;"></div>
        <div style="width: 8px; height: 100px; background: #667eea; border-radius: 4px; animation: pulse 0.8s infinite;"></div>
        <div style="width: 8px; height: 85px; background: #667eea; border-radius: 4px; animation: pulse 0.7s infinite;"></div>
        <div style="width: 8px; height: 65px; background: #667eea; border-radius: 4px; animation: pulse 0.6s infinite;"></div>
        <div style="width: 8px; height: 45px; background: #667eea; border-radius: 4px; animation: pulse 0.5s infinite;"></div>
      </div>

      <div style="font-size: 48px; font-weight: 300; margin-bottom: 8px;">00:35</div>
      <div style="font-size: 14px; color: rgba(255,255,255,0.8);">Recording in progress...</div>
    </div>

    <!-- Settings Panel -->
    <div style="background: rgba(255,255,255,0.95); border-radius: 16px; padding: 32px; width: 100%; max-width: 800px; color: #333; margin-bottom: 32px;">
      <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 24px;">Recording Settings</h3>

      <!-- Quality Setting -->
      <div style="margin-bottom: 24px;">
        <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px;">Audio Quality</label>
        <div style="display: flex; gap: 12px;">
          <button style="flex: 1; padding: 10px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px;">High (16kHz)</button>
          <button style="flex: 1; padding: 10px; background: rgba(102, 126, 234, 0.2); color: #667eea; border: 1px solid #667eea; border-radius: 8px; cursor: pointer; font-size: 14px;">Medium (8kHz)</button>
        </div>
      </div>

      <!-- Noise Reduction -->
      <div style="margin-bottom: 24px;">
        <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px;">Noise Reduction</label>
        <div style="display: flex; align-items: center; gap: 16px;">
          <input type="checkbox" checked style="width: 20px; height: 20px; cursor: pointer;">
          <span style="font-size: 14px;">Enable DNS noise cancellation</span>
        </div>
      </div>

      <!-- Language -->
      <div>
        <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px;">Language</label>
        <select style="width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px;">
          <option selected>العربية (Arabic)</option>
          <option>English</option>
          <option>Français (French)</option>
          <option>Español (Spanish)</option>
        </select>
      </div>
    </div>

    <!-- Control Buttons -->
    <div style="display: flex; gap: 16px; width: 100%; max-width: 800px;">
      <button style="flex: 1; padding: 16px 24px; background: rgba(255,255,255,0.2); border: none; border-radius: 12px; color: white; cursor: pointer; font-weight: 600; font-size: 16px; transition: all 0.3s;">⏸ Pause</button>
      <button style="flex: 1; padding: 16px 24px; background: #ff4757; border: none; border-radius: 12px; color: white; cursor: pointer; font-weight: 600; font-size: 16px; transition: all 0.3s;">⏹ Stop & Save</button>
      <button style="flex: 1; padding: 16px 24px; background: #2ed573; border: none; border-radius: 12px; color: white; cursor: pointer; font-weight: 600; font-size: 16px; transition: all 0.3s;">🎤 Start Recording</button>
    </div>
  </div>
</div>

<style>
  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

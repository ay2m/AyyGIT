<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { color: #1d4ed8; }
  </style>
</helmet>

<!-- Dashboard -->
<div style="width: 1440px; min-height: 900px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
  <!-- Header -->
  <div style="padding: 24px 32px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">🎤</div>
      <h1 style="font-size: 24px; font-weight: 600;">VoiceStudio</h1>
    </div>
    <div style="display: flex; gap: 16px;">
      <button style="padding: 10px 16px; background: rgba(255,255,255,0.2); border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 14px;">Settings</button>
      <button style="padding: 10px 16px; background: rgba(255,255,255,0.2); border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 14px;">Profile</button>
    </div>
  </div>

  <!-- Main Content -->
  <div style="padding: 48px 32px;">
    <!-- Welcome Section -->
    <div style="margin-bottom: 48px;">
      <h2 style="font-size: 42px; font-weight: 700; margin-bottom: 12px;">Welcome to VoiceStudio</h2>
      <p style="font-size: 18px; opacity: 0.9;">Create, customize, and merge professional voices powered by AI</p>
    </div>

    <!-- Quick Actions Grid -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
      <!-- Record Voice -->
      <div style="background: rgba(255,255,255,0.95); border-radius: 12px; padding: 32px; cursor: pointer; transition: transform 0.3s; text-align: center; color: #333;">
        <div style="font-size: 48px; margin-bottom: 16px;">🎙️</div>
        <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">Record Voice</h3>
        <p style="font-size: 14px; color: #666; margin-bottom: 16px;">Create a new voice model from audio</p>
        <button style="padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500;">Get Started</button>
      </div>

      <!-- Merge Voices -->
      <div style="background: rgba(255,255,255,0.95); border-radius: 12px; padding: 32px; cursor: pointer; text-align: center; color: #333;">
        <div style="font-size: 48px; margin-bottom: 16px;">🔀</div>
        <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">Merge Voices</h3>
        <p style="font-size: 14px; color: #666; margin-bottom: 16px;">Combine multiple voices into one</p>
        <button style="padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500;">Merge</button>
      </div>

      <!-- Synthesize -->
      <div style="background: rgba(255,255,255,0.95); border-radius: 12px; padding: 32px; cursor: pointer; text-align: center; color: #333;">
        <div style="font-size: 48px; margin-bottom: 16px;">🔊</div>
        <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">Synthesize</h3>
        <p style="font-size: 14px; color: #666; margin-bottom: 16px;">Convert text to speech with your voice</p>
        <button style="padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500;">Create Audio</button>
      </div>
    </div>

    <!-- Recent Voices -->
    <div style="margin-top: 48px;">
      <h3 style="font-size: 20px; font-weight: 600; margin-bottom: 20px;">Your Voices</h3>
      <div style="display: flex; gap: 16px;">
        <div style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 16px; flex: 1; min-height: 100px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.5);">No voices yet</div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

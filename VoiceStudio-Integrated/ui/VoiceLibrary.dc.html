<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { color: #1d4ed8; }
  </style>
</helmet>

<!-- Voice Library Screen -->
<div style="width: 1440px; min-height: 900px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; display: flex; flex-direction: column;">
  <!-- Header -->
  <div style="padding: 24px 32px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">🎤</div>
      <h1 style="font-size: 24px; font-weight: 600;">VoiceStudio - My Voices</h1>
    </div>
    <div style="display: flex; gap: 16px;">
      <button style="padding: 10px 16px; background: rgba(255,255,255,0.2); border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 14px;">← Back</button>
    </div>
  </div>

  <!-- Filters & Actions -->
  <div style="padding: 24px 32px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; gap: 12px; align-items: center;">
      <input type="text" placeholder="Search voices..." style="padding: 10px 16px; border: none; border-radius: 8px; width: 240px; font-size: 14px;">
      <select style="padding: 10px 16px; border: none; border-radius: 8px; background: rgba(255,255,255,0.2); color: white; font-size: 14px; cursor: pointer;">
        <option style="color: #333;">All Types</option>
        <option style="color: #333;">Original</option>
        <option style="color: #333;">Merged</option>
        <option style="color: #333;">Cloned</option>
      </select>
      <select style="padding: 10px 16px; border: none; border-radius: 8px; background: rgba(255,255,255,0.2); color: white; font-size: 14px; cursor: pointer;">
        <option style="color: #333;">Recently Created</option>
        <option style="color: #333;">Alphabetical</option>
        <option style="color: #333;">Most Used</option>
      </select>
    </div>
    <button style="padding: 10px 16px; background: #2ed573; border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 14px; font-weight: 600;">+ New Voice</button>
  </div>

  <!-- Voice Grid -->
  <div style="padding: 32px; flex: 1; overflow-y: auto;">
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;">

      <!-- Voice Card 1 -->
      <div style="background: rgba(255,255,255,0.95); border-radius: 16px; overflow: hidden; transition: transform 0.3s; color: #333;">
        <!-- Waveform Preview -->
        <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 120px; display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding: 16px;">
          <div style="width: 6px; height: 40px; background: rgba(255,255,255,0.8); border-radius: 3px;"></div>
          <div style="width: 6px; height: 60px; background: rgba(255,255,255,0.9); border-radius: 3px;"></div>
          <div style="width: 6px; height: 80px; background: white; border-radius: 3px;"></div>
          <div style="width: 6px; height: 70px; background: rgba(255,255,255,0.8); border-radius: 3px;"></div>
          <div style="width: 6px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 3px;"></div>
        </div>

        <!-- Details -->
        <div style="padding: 20px; border-bottom: 1px solid #f0f0f0;">
          <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">Professional Voice</h3>
          <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #999; margin-bottom: 12px;">
            <span>⏱ 2m 30s</span>
            <span>🎵 16kHz</span>
            <span style="background: #e3f2fd; color: #667eea; padding: 2px 8px; border-radius: 4px;">Original</span>
          </div>
          <div style="font-size: 12px; color: #999;">Created 2 days ago</div>
        </div>

        <!-- Actions -->
        <div style="padding: 16px; display: flex; gap: 8px;">
          <button style="flex: 1; padding: 8px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">▶ Play</button>
          <button style="flex: 1; padding: 8px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">⬇ Download</button>
          <button style="width: 36px; padding: 8px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer;">⋮</button>
        </div>
      </div>

      <!-- Voice Card 2 -->
      <div style="background: rgba(255,255,255,0.95); border-radius: 16px; overflow: hidden; transition: transform 0.3s; color: #333;">
        <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 120px; display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding: 16px;">
          <div style="width: 6px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 3px;"></div>
          <div style="width: 6px; height: 70px; background: rgba(255,255,255,0.8); border-radius: 3px;"></div>
          <div style="width: 6px; height: 90px; background: white; border-radius: 3px;"></div>
          <div style="width: 6px; height: 75px; background: rgba(255,255,255,0.85); border-radius: 3px;"></div>
          <div style="width: 6px; height: 55px; background: rgba(255,255,255,0.75); border-radius: 3px;"></div>
        </div>

        <div style="padding: 20px; border-bottom: 1px solid #f0f0f0;">
          <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">Casual Voice</h3>
          <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #999; margin-bottom: 12px;">
            <span>⏱ 1m 45s</span>
            <span>🎵 16kHz</span>
            <span style="background: #f3e5f5; color: #7b1fa2; padding: 2px 8px; border-radius: 4px;">Original</span>
          </div>
          <div style="font-size: 12px; color: #999;">Created 5 days ago</div>
        </div>

        <div style="padding: 16px; display: flex; gap: 8px;">
          <button style="flex: 1; padding: 8px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">▶ Play</button>
          <button style="flex: 1; padding: 8px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">⬇ Download</button>
          <button style="width: 36px; padding: 8px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer;">⋮</button>
        </div>
      </div>

      <!-- Voice Card 3 -->
      <div style="background: rgba(255,255,255,0.95); border-radius: 16px; overflow: hidden; transition: transform 0.3s; color: #333;">
        <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 120px; display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding: 16px;">
          <div style="width: 6px; height: 45px; background: rgba(255,255,255,0.75); border-radius: 3px;"></div>
          <div style="width: 6px; height: 65px; background: rgba(255,255,255,0.85); border-radius: 3px;"></div>
          <div style="width: 6px; height: 85px; background: white; border-radius: 3px;"></div>
          <div style="width: 6px; height: 72px; background: rgba(255,255,255,0.82); border-radius: 3px;"></div>
          <div style="width: 6px; height: 52px; background: rgba(255,255,255,0.78); border-radius: 3px;"></div>
        </div>

        <div style="padding: 20px; border-bottom: 1px solid #f0f0f0;">
          <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">Merged Voice</h3>
          <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #999; margin-bottom: 12px;">
            <span>⏱ 3m 10s</span>
            <span>🎵 16kHz</span>
            <span style="background: #c8e6c9; color: #2e7d32; padding: 2px 8px; border-radius: 4px;">Merged</span>
          </div>
          <div style="font-size: 12px; color: #999;">Created 1 week ago</div>
        </div>

        <div style="padding: 16px; display: flex; gap: 8px;">
          <button style="flex: 1; padding: 8px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">▶ Play</button>
          <button style="flex: 1; padding: 8px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">⬇ Download</button>
          <button style="width: 36px; padding: 8px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer;">⋮</button>
        </div>
      </div>

      <!-- Empty State / Add Card -->
      <div style="background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.3); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s;">
        <div style="font-size: 48px; margin-bottom: 16px;">+</div>
        <div style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">Create New Voice</div>
        <div style="font-size: 14px; opacity: 0.8;">Record and train a new voice model</div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
